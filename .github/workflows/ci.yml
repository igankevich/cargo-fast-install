---
name: Test yard

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.15"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check
        run: ./ci/check.sh
  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15", "3.14", "3.13", "3.12", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false
      - name: Unit tests
        run: ./ci/unit-tests.sh
      - name: Integration tests
        run: ./ci/integration-tests.sh
      - name: Check bootstrap command
        run: ./ci/check-bootstrap.sh
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false
      - name: Unit tests
        run: ./ci/unit-tests.sh
      - name: Check bootstrap command
        run: ./ci/check-bootstrap.sh
  windows:
    runs-on: windows-latest
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false
      - name: Unit tests
        run: ./ci/unit-tests.sh
      - name: Integration tests
        shell: bash
        run: ./ci/integration-tests.sh
      - name: Check bootstrap command
        shell: bash
        run: ./ci/check-bootstrap.sh
