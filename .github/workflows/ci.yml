---
name: CI
on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test
        run: ./test.sh
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test
        run: ./test.sh
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test
        shell: bash
        run: ./test.sh
