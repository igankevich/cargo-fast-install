---
name: Build Rust crates with `yard`

on:
  workflow_call:
    inputs:
      crates:
        type: string
        required: true
      target:
        type: string
        required: false
      profile:
        type: string
        required: false
      rustup-version:
        type: string
        required: false
      rustup-hash:
        type: string
        required: false
      rust-version:
        type: string
        required: false
      docker-image:
        type: string
        required: false
    outputs:
      archive:
        value: ${{ jobs.yarn-build.outputs.output1 }}
      provenance:
        value: ${{ jobs.yarn-build.outputs.output2 }}

jobs:
  yard-build:
    runs-on: ubuntu-26.04
    outputs:
      archive: ${{ steps.step1.outputs.firstword }}
      provenance: ${{ steps.step2.outputs.secondword }}
    steps:
      - name: Install `yard`
        run: |
          curl -Lf -o yard https://github.com/igankevich/yard/raw/${{ github.workflow_sha }}/yard
          chmod +x yard
      - name: Build `${{ inputs.crates }}` with `yard`
        env:
          target: ${{ inputs.target }}
          profile: ${{ inputs.profile }}
          rustup_version: ${{ inputs.rustup-version }}
          rustup_hash: ${{ inputs.rustup-hash }}
          rust_version: ${{ inputs.rust-version }}
          docker_image: ${{ inputs.docker-image }}
        run: |
          ./yard build \
            ${rustup_version:+--rustup-version "$rustup_version"} \
            ${rustup_hash:+--rustup-hash "$rustup_hash"} \
            ${rust_version:+--rust-version "$rust_version"} \
            ${docker_image:+--docker-image "$docker_image"} \
            ${target:+--target "$target"} \
            ${profile:+--profile "$profile"} \
            ${{ inputs.crates }}
      - name: Attest artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            archive.tar.gz
            provenance.json
